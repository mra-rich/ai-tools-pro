# auto-reply.yml - Stay-by OTONOM: balas komentar di semua thread akun otomatis.
# Scan tiap 2 jam; maks 1 balasan per run; skip spam; state anti-dobel.
name: Auto Reply Threads

on:
  schedule:
    - cron: '0 */2 * * *'   # tiap 2 jam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Balas komentar otomatis
        env:
          THREADS_API_CONFIG: ${{ secrets.THREADS_API_CONFIG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JARVIS_OWNER: mrodliarif
        run: node promo/auto-reply.js
      - name: Commit state anti-dobel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'promo/autoreply/*.json'
          git commit -m "chore(autoreply): update state [skip ci]" || echo tidak-ada-perubahan
          git push
