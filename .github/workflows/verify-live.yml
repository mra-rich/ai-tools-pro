name: Hourly Threads Report (Meta API)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Fetch Stats and Send to Telegram Topic 112
        env:
          THREADS_API_CONFIG: ${{ secrets.THREADS_API_CONFIG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cat << 'JS' > run.js
          const BASE = "https://graph.threads.net/v1.0";
          async function main() {
            const rawEnv = process.env.THREADS_API_CONFIG || "";
            let cfg = {};
            if (rawEnv.startsWith("{")) cfg = JSON.parse(rawEnv);
            else cfg = { access_token: rawEnv.trim() };
            
            const token = cfg.access_token;
            if(!token) { console.log("No token"); return; }
            
            const res = await fetch(`${BASE}/me/threads?fields=id,text,permalink,timestamp&limit=5&access_token=${token}`).then(r=>r.json());
            const posts = res.data || [];
            
            let msg = "📊 **LAPORAN THREADS PER JAM**\n\n";
            let totalV=0, totalL=0, totalR=0;
            
            for(const p of posts) {
              const ins = await fetch(`${BASE}/${p.id}/insights?metric=views,likes,replies&access_token=${token}`).then(r=>r.json()).catch(()=>({}));
              const m = {};
              if(ins.data) ins.data.forEach(x => { m[x.name] = x.values[0].value; });
              
              const v = m.views || 0;
              const l = m.likes || 0;
              const r = m.replies || 0;
              totalV += v; totalL += l; totalR += r;
              
              const txt = (p.text || "").replace(/\n/g, " ").slice(0, 50);
              msg += `• **[${txt}...]**\n  👀 ${v} | ❤️ ${l} | 💬 ${r}\n  🔗 ${p.permalink}\n\n`;
            }
            
            msg = `📊 **LAPORAN THREADS PER JAM**\n` +
                  `👀 Total Views: ${totalV} | ❤️ Likes: ${totalL} | 💬 Replies: ${totalR}\n\n` +
                  `📌 **5 Post Terbaru:**\n` + msg.replace("📊 **LAPORAN THREADS PER JAM**\n\n", "");
            
            console.log(msg);
            
            // Send to Telegram Topic 112 via Bot
            const tgToken = process.env.TELEGRAM_BOT_TOKEN;
            if(tgToken) {
              await fetch(`https://api.telegram.org/bot${tgToken}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                  chat_id: '-1004318318800',
                  message_thread_id: 112,
                  text: msg,
                  parse_mode: 'Markdown'
                })
              });
            }
          }
          main();
          JS
          node run.js
