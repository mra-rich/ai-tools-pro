# comments.yml - Ambil komentar Threads berkala dan commit hasilnya ke repo.
# Menulis promo/comments/latest.json supaya bisa dibaca agent (GITHUB_TOKEN).
# Jadwal: tiap 6 jam (03,09,15,21 UTC = 10,16,22,04 WIB).
name: Threads Comments

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Ambil komentar
        env:
          THREADS_API_CONFIG: ${{ secrets.THREADS_API_CONFIG }}
        run: node promo/read-comments.js
      - name: Commit hasil komentar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'promo/comments/*.json'
          git commit -m "chore(comments): update $(date +%F) [skip ci]" || echo tidak-ada-perubahan
          git push
