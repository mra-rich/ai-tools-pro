# promo-insights.yml - Ambil insight Threads berkala & commit hasil ke repo.
# Menulis promo/insights/latest.json supaya bisa dibaca agent (GITHUB_TOKEN).
# Jadwal: 17:00 UTC = 00:00 WIB (30 menit setelah posting harian 16:30 UTC).
name: Promo Threads Insights

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Ambil insight Threads
        env:
          THREADS_API_CONFIG: ${{ secrets.THREADS_API_CONFIG }}
        run: node promo/insights.js
      - name: Commit hasil insight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'promo/insights/*.json'
          git commit -m "chore(insights): update $(date +%F) [skip ci]" || echo tidak-ada-perubahan
          git push
