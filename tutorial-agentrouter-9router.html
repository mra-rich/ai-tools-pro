<!DOCTYPE html>
<html lang="id">
<head>
<script>
(function() {
  var sessKey = 'aitp_session';
  var sess = localStorage.getItem(sessKey);
  if (!sess) {
    alert('Akses Ditolak: Halaman ini hanya untuk member ter-aktivasi. Silakan masukkan Order ID di halaman utama.');
    window.location.href = '/';
    return;
  }
  try {
    var data = JSON.parse(sess);
    if (!data.orderId || !data.deviceId) {
      throw new Error('invalid');
    }
  } catch (e) {
    alert('Akses Ditolak: Sesi kamu tidak valid.');
    window.location.href = '/';
  }
})();
</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1020">
  <title>Panduan AgentRouter ke 9Router</title>
  <style>
    :root {
      --bg: #09101f;
      --surface: #101a2e;
      --surface-raised: #15223a;
      --border: #263653;
      --text: #eff5ff;
      --muted: #9baac4;
      --primary: #6ea8fe;
      --primary-strong: #3d82f6;
      --success: #47d18c;
      --warning: #ffbc57;
      --danger: #ff7184;
      --code: #080e1b;
      --shadow: 0 24px 60px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background: radial-gradient(circle at top right, #172e57 0, var(--bg) 46rem);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    button { font: inherit; }
    .page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
    .app { display: grid; grid-template-columns: 290px minmax(0, 1fr); overflow: hidden; border: 1px solid var(--border); border-radius: 24px; background: rgba(16, 26, 46, .88); box-shadow: var(--shadow); }
    .rail { padding: 24px; border-right: 1px solid var(--border); background: rgba(7, 13, 27, .35); }
    .content { min-width: 0; padding: 32px; }
    @media (max-width: 760px) {
      .page { width: min(100% - 20px, 680px); padding: 10px 0; }
      .app { display: block; border-radius: 18px; }
      .rail { border-right: 0; border-bottom: 1px solid var(--border); padding: 14px; overflow-x: auto; }
      .content { padding: 22px 16px; }
    }
    .hero { max-width: 760px; margin: 0 auto 28px; text-align: center; }
    .eyebrow { margin: 0 0 8px; color: var(--primary); font-size: .72rem; font-weight: 800; letter-spacing: .13em; }
    h1, h2, h3 { margin: 0; line-height: 1.18; }
    h1 { font-size: clamp(2rem, 5vw, 3.35rem); letter-spacing: -.04em; }
    .hero > p:not(.eyebrow) { max-width: 600px; margin: 14px auto 22px; color: var(--muted); }
    .mode-switch { display: inline-flex; gap: 4px; padding: 5px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
    .mode-button, .button, .text-button, .step-link, .copy-button, .icon-button { cursor: pointer; }
    .mode-button { border: 0; border-radius: 10px; padding: 10px 14px; color: var(--muted); background: transparent; font-weight: 700; }
    .mode-button.is-active { color: #071225; background: var(--primary); }
    .progress-label { margin: 0 0 16px; color: var(--muted); font-size: .84rem; font-weight: 700; }
    .step-rail { display: grid; gap: 7px; }
    .step-link { width: 100%; display: flex; gap: 11px; align-items: center; padding: 10px; border: 1px solid transparent; border-radius: 12px; color: var(--muted); background: transparent; text-align: left; }
    .step-link:hover, .step-link:focus-visible { border-color: var(--border); background: var(--surface); outline: 0; }
    .step-link.is-active { color: var(--text); border-color: rgba(110, 168, 254, .55); background: rgba(110, 168, 254, .12); }
    .step-link.is-complete .step-number { color: #052418; background: var(--success); }
    .step-number { flex: 0 0 26px; width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 50%; font-size: .75rem; font-weight: 800; }
    .step-title { display: block; font-size: .88rem; font-weight: 800; }
    .step-summary { display: block; margin-top: 1px; color: var(--muted); font-size: .73rem; }
    .text-button { width: 100%; margin-top: 18px; padding: 9px; border: 0; color: var(--primary); background: transparent; font-weight: 800; text-align: left; }
    .step-kicker { margin: 0 0 6px; color: var(--primary); font-size: .8rem; font-weight: 800; }
    .step-panel-title { font-size: clamp(1.55rem, 4vw, 2.2rem); letter-spacing: -.03em; }
    .step-description { margin: 12px 0 24px; color: var(--muted); }
    .card { margin-top: 16px; padding: 18px; border: 1px solid var(--border); border-radius: 16px; background: rgba(8, 15, 29, .32); }
    .card h3 { margin-bottom: 8px; font-size: 1rem; }
    .command { position: relative; margin: 12px 0; padding: 17px 64px 17px 16px; overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; color: #d9e7ff; background: var(--code); font: .83rem/1.65 "SFMono-Regular", Consolas, "Liberation Mono", monospace; white-space: pre; }
    .copy-button { position: absolute; top: 9px; right: 9px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 7px; color: var(--text); background: var(--surface-raised); font-size: .72rem; font-weight: 800; }
    .callout { margin: 16px 0 0; padding: 14px 15px; border-left: 4px solid var(--primary); border-radius: 0 10px 10px 0; background: rgba(110, 168, 254, .1); color: var(--text); }
    .callout.warning { border-left-color: var(--warning); background: rgba(255, 188, 87, .1); }
    .callout.success { border-left-color: var(--success); background: rgba(71, 209, 140, .1); }
    .wizard-footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); }
    .button { min-height: 44px; border-radius: 10px; padding: 10px 14px; font-weight: 800; }
    .button-secondary { border: 1px solid var(--border); color: var(--text); background: transparent; }
    .button-primary { border: 1px solid var(--primary-strong); color: #061326; background: var(--primary); }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .troubleshooting-dialog { width: min(760px, calc(100% - 24px)); max-height: min(760px, calc(100% - 24px)); border: 1px solid var(--border); border-radius: 20px; color: var(--text); background: var(--surface); box-shadow: var(--shadow); }
    .troubleshooting-dialog::backdrop { background: rgba(3, 7, 16, .72); backdrop-filter: blur(4px); }
    .dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    .icon-button { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 10px; color: var(--text); background: transparent; font-size: 1.4rem; line-height: 1; }
    .trouble-item { padding: 18px 0; border-bottom: 1px solid var(--border); }
    .trouble-item:last-child { border-bottom: 0; }
    .trouble-item p { margin: 7px 0 0; color: var(--muted); }
    button:focus-visible { outline: 3px solid rgba(110, 168, 254, .7); outline-offset: 2px; }
    @media (max-width: 760px) {
      .progress-label { margin-bottom: 9px; }
      .step-rail { display: flex; width: max-content; gap: 6px; }
      .step-link { width: auto; min-width: 44px; min-height: 44px; padding: 8px; justify-content: center; }
      .step-link .step-title, .step-link .step-summary { display: none; }
      .text-button { display: none; }
      .wizard-footer { position: sticky; bottom: 0; padding-bottom: 4px; background: var(--surface); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">PANDUAN INTERAKTIF</p>
      <h1>Hubungkan AgentRouter ke 9Router.</h1>
      <p>Pilih lingkungan Anda. Selesaikan satu langkah setiap kali.</p>
      <div class="mode-switch" aria-label="Pilih lingkungan instalasi">
        <button id="modeVps" class="mode-button is-active" type="button" aria-pressed="true">Server VPS Linux</button>
        <button id="modeLocal" class="mode-button" type="button" aria-pressed="false">Komputer Lokal</button>
      </div>
    </header>

    <section class="app" aria-label="Wizard integrasi AgentRouter">
      <aside class="rail">
        <p id="progressLabel" class="progress-label" aria-live="polite"></p>
        <nav id="stepRail" class="step-rail" aria-label="Langkah panduan"></nav>
        <button id="troubleshootingButton" class="text-button" type="button">Buka troubleshooting</button>
      </aside>
      <section class="content" aria-live="polite">
        <div id="stepPanel"></div>
        <footer class="wizard-footer">
          <button id="previousButton" class="button button-secondary" type="button">Sebelumnya</button>
          <button id="nextButton" class="button button-primary" type="button">Tandai selesai &amp; lanjut</button>
        </footer>
      </section>
    </section>

    <dialog id="troubleshootingDialog" class="troubleshooting-dialog" aria-labelledby="troubleshootingTitle">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">BANTUAN CEPAT</p>
          <h2 id="troubleshootingTitle">Troubleshooting</h2>
        </div>
        <button id="closeTroubleshootingButton" class="icon-button" type="button" aria-label="Tutup troubleshooting">×</button>
      </div>
      <div id="troubleshootingContent"></div>
    </dialog>
  </main>
  <script>
    const guides = {
      vps: [
        {
          title: "Install proxy",
          summary: "Clone dan unduh binary",
          description: "Pasang AgentRouter Spoof Proxy pada server VPS Linux.",
          cards: [{
            heading: "Clone repositori dan unduh binary",
            command: `git clone https://github.com/trefeon/agentrouter-spoof-proxy.git
cd agentrouter-spoof-proxy
mkdir -p dist
curl -sL https://github.com/trefeon/agentrouter-spoof-proxy/releases/download/v2.0.0/agentrouter-proxy-linux-amd64 -o dist/agentrouter-proxy
chmod +x dist/agentrouter-proxy`
          }]
        },
        {
          title: "Pasang WARP",
          summary: "Hindari blokir WAF Alibaba",
          description: "IP VPS GCP/AWS bisa diblokir WAF Alibaba. Gunakan Cloudflare WARP saat validasi provider.",
          cards: [{
            heading: "Install dan hubungkan Cloudflare WARP",
            command: `sudo rm -f /etc/apt/sources.list.d/cloudflare-client.list
curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

sudo apt update && sudo apt install -y cloudflare-warp

sudo warp-cli --accept-tos registration new
sudo warp-cli --accept-tos connect`,
            callout: {
              type: "warning",
              text: "PENTING UNTUK USER CLOUDFLARE TUNNEL: WARP dapat membuat cloudflared mati sementara (Error 1033). Setelah Save di 9Router, jalankan sudo warp-cli --accept-tos disconnect."
            }
          }]
        },
        {
          title: "Daftarkan systemd",
          summary: "Jalankan proxy sebagai service",
          description: "Buat service systemd agar proxy berjalan otomatis setelah server menyala.",
          cards: [{
            heading: "Buat dan mulai service",
            command: `sudo tee /etc/systemd/system/agentrouter-proxy.service > /dev/null << 'EOF'
[Unit]
Description=AgentRouter Spoof Proxy (Go)
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=hermes
Group=hermes
WorkingDirectory=/home/hermes/agentrouter-spoof-proxy
ExecStart=/home/hermes/agentrouter-spoof-proxy/dist/agentrouter-proxy
EnvironmentFile=/home/hermes/agentrouter-spoof-proxy/.env
Restart=always
RestartSec=2
TimeoutStopSec=20
KillSignal=SIGTERM

[Install]
WantedBy=multi-user.target
EOF

sudo systemctl daemon-reload
sudo systemctl enable --now agentrouter-proxy`
          }]
        },
        {
          title: "Tambah provider",
          summary: "Simpan provider di 9Router",
          description: "Buka Dashboard 9Router lalu pilih + Add OpenAI Compatible.",
          cards: [{
            heading: "Isi form provider",
            list: [
              "Prefix: AR",
              "API Type: Chat Completions",
              "Base URL: http://127.0.0.1:8318/v1 — jangan gunakan localhost",
              "API Key: API Key AgentRouter (sk-...)",
              "Model ID (opsional): gpt-5.6-sol",
              "Klik Check hingga valid, lalu Create / Save."
            ]
          }]
        },
        {
          title: "Selesai",
          summary: "Uji model AR",
          description: "Provider tersimpan. Pilih model berprefix AR di 9Router untuk mulai menggunakannya.",
          cards: [{ heading: "Ingat", callout: { type: "success", text: "Jika memakai Cloudflare Tunnel, putuskan WARP setelah Save dengan sudo warp-cli --accept-tos disconnect." } }]
        }
      ],
      local: [
        {
          title: "Install proxy",
          summary: "Pilih native atau Docker",
          description: "Komputer lokal memakai IP residential, sehingga Cloudflare WARP tidak diperlukan.",
          cards: [
            { heading: "Windows (PowerShell Admin)", command: "iwr -useb https://raw.githubusercontent.com/trefeon/agentrouter-spoof-proxy/main/scripts/install.ps1 | iex" },
            { heading: "Windows (fallback lokal)", list: ["Download agentrouter-proxy.exe dari GitHub Release.", "Double-click agentrouter-proxy.exe atau jalankan via CMD."] },
            { heading: "macOS / Linux Desktop", command: "curl -fsSL https://raw.githubusercontent.com/trefeon/agentrouter-spoof-proxy/main/scripts/install.sh | bash" },
            { heading: "Docker (semua OS)", command: "git clone https://github.com/trefeon/agentrouter-spoof-proxy.git\ncd agentrouter-spoof-proxy\ndocker compose up -d" }
          ]
        },
        {
          title: "Konfigurasi 9Router",
          summary: "Atur Base URL tepat",
          description: "Buka 9Router lokal pada http://localhost:20128 lalu pilih + Add OpenAI Compatible.",
          cards: [{
            heading: "Pilih Base URL",
            list: [
              "Native tanpa Docker: http://127.0.0.1:8318/v1",
              "9Router dalam Docker Desktop: http://host.docker.internal:8318/v1",
              "Isi API Key dan Prefix AR, lalu klik Check dan Save."
            ]
          }]
        },
        {
          title: "Verifikasi",
          summary: "Check lalu simpan",
          description: "Status Check harus valid sebelum provider disimpan.",
          cards: [{ heading: "Hasil yang diharapkan", callout: { type: "success", text: "Provider tersimpan dan model berprefix AR muncul dalam daftar model 9Router." } }]
        },
        {
          title: "Selesai",
          summary: "Mulai gunakan model AR",
          description: "Integrasi lokal selesai. Pilih model AR dari daftar model 9Router.",
          cards: [{ heading: "Tidak perlu WARP", callout: { type: "success", text: "IP rumah biasanya tidak memerlukan Cloudflare WARP untuk melewati WAF Alibaba." } }]
        }
      ]
    };

    const troubleshootingItems = [
      {
        issue: "URL not allowed",
        cause: "Input URL memakai kata localhost.",
        solution: "Ganti Base URL menjadi http://127.0.0.1:8318/v1."
      },
      {
        issue: "Status Invalid saat Check",
        cause: "WARP terputus atau terkena CAPTCHA Alibaba.",
        solution: "Jalankan sudo warp-cli --accept-tos connect di VPS."
      },
      {
        issue: "Cloudflare Tunnel Error 1033",
        cause: "WARP aktif mengubah rute tunnel.",
        solution: "Jalankan sudo warp-cli --accept-tos disconnect setelah Save."
      },
      {
        issue: "Model tidak muncul di list UI",
        cause: "Custom Provider belum tersimpan sempurna.",
        solution: "Hapus provider lama di UI, lalu tambah ulang sesuai instruksi."
      }
    ];

    const state = { mode: "vps", activeIndex: 0, completed: { vps: [], local: [] } };

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderCard(card) {
      const command = card.command
        ? `<pre class="command"><code>${escapeHtml(card.command)}</code><button class="copy-button" type="button" data-copy-command>Salin</button></pre>`
        : "";
      const list = card.list
        ? `<ul>${card.list.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
        : "";
      const callout = card.callout
        ? `<div class="callout ${card.callout.type}">${escapeHtml(card.callout.text)}</div>`
        : "";
      return `<article class="card"><h3>${escapeHtml(card.heading)}</h3>${command}${list}${callout}</article>`;
    }

    function renderWizard() {
      const steps = guides[state.mode];
      const current = steps[state.activeIndex];
      const completed = state.completed[state.mode];
      document.getElementById("progressLabel").textContent = `Langkah ${state.activeIndex + 1} dari ${steps.length}`;
      document.getElementById("stepRail").innerHTML = steps.map((step, index) => `
        <button class="step-link ${index === state.activeIndex ? "is-active" : ""} ${completed.includes(index) ? "is-complete" : ""}"
          type="button" data-step-index="${index}" aria-current="${index === state.activeIndex ? "step" : "false"}">
          <span class="step-number">${completed.includes(index) ? "✓" : index + 1}</span>
          <span><span class="step-title">${escapeHtml(step.title)}</span><span class="step-summary">${escapeHtml(step.summary)}</span></span>
        </button>`).join("");
      document.getElementById("stepPanel").innerHTML = `
        <p class="step-kicker">${state.mode === "vps" ? "SERVER VPS LINUX" : "KOMPUTER LOKAL"}</p>
        <h2 class="step-panel-title">${escapeHtml(current.title)}</h2>
        <p class="step-description">${escapeHtml(current.description)}</p>
        ${current.cards.map(renderCard).join("")}`;
      document.getElementById("previousButton").disabled = state.activeIndex === 0;
      document.getElementById("nextButton").textContent = state.activeIndex === steps.length - 1 ? "Selesaikan panduan" : "Tandai selesai & lanjut";
    }

    function setMode(mode) {
      state.mode = mode;
      state.activeIndex = 0;
      document.getElementById("modeVps").classList.toggle("is-active", mode === "vps");
      document.getElementById("modeLocal").classList.toggle("is-active", mode === "local");
      document.getElementById("modeVps").setAttribute("aria-pressed", String(mode === "vps"));
      document.getElementById("modeLocal").setAttribute("aria-pressed", String(mode === "local"));
      renderWizard();
    }

    function selectStep(index) {
      state.activeIndex = index;
      renderWizard();
    }

    function advanceStep() {
      const completed = state.completed[state.mode];
      if (!completed.includes(state.activeIndex)) completed.push(state.activeIndex);
      if (state.activeIndex < guides[state.mode].length - 1) state.activeIndex += 1;
      renderWizard();
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.append(textarea);
      try {
        textarea.select();
        if (!document.execCommand("copy")) throw new Error("Copy failed");
      } finally {
        textarea.remove();
      }
    }

    const copyFeedbackTimers = new WeakMap();
    const copyRequestVersions = new WeakMap();

    document.getElementById("stepPanel").addEventListener("click", async (event) => {
      const button = event.target.closest("[data-copy-command]");
      if (!button) return;
      const requestVersion = (copyRequestVersions.get(button) || 0) + 1;
      copyRequestVersions.set(button, requestVersion);
      window.clearTimeout(copyFeedbackTimers.get(button));
      copyFeedbackTimers.delete(button);

      const command = button.parentElement.querySelector("code").textContent;
      let label;
      try {
        await copyText(command);
        label = "Tersalin";
      } catch {
        label = "Gagal";
      }
      if (copyRequestVersions.get(button) !== requestVersion) return;

      button.textContent = label;
      const resetTimer = window.setTimeout(() => {
        if (copyRequestVersions.get(button) !== requestVersion) return;
        button.textContent = "Salin";
        copyFeedbackTimers.delete(button);
      }, 1500);
      copyFeedbackTimers.set(button, resetTimer);
    });

    function renderTroubleshooting() {
      document.getElementById("troubleshootingContent").innerHTML = troubleshootingItems.map((item) => `
        <article class="trouble-item">
          <h3>${escapeHtml(item.issue)}</h3>
          <p><strong>Penyebab:</strong> ${escapeHtml(item.cause)}</p>
          <p><strong>Solusi:</strong> ${escapeHtml(item.solution)}</p>
        </article>`).join("");
    }

    const troubleshootingDialog = document.getElementById("troubleshootingDialog");
    document.getElementById("troubleshootingButton").addEventListener("click", () => troubleshootingDialog.showModal());
    document.getElementById("closeTroubleshootingButton").addEventListener("click", () => troubleshootingDialog.close());
    troubleshootingDialog.addEventListener("click", (event) => {
      if (event.target === troubleshootingDialog) troubleshootingDialog.close();
    });

    document.getElementById("modeVps").addEventListener("click", () => setMode("vps"));
    document.getElementById("modeLocal").addEventListener("click", () => setMode("local"));
    document.getElementById("stepRail").addEventListener("click", (event) => {
      const button = event.target.closest("[data-step-index]");
      if (button) selectStep(Number(button.dataset.stepIndex));
    });
    document.getElementById("previousButton").addEventListener("click", () => {
      if (state.activeIndex > 0) selectStep(state.activeIndex - 1);
    });
    document.getElementById("nextButton").addEventListener("click", advanceStep);

    renderTroubleshooting();
    renderWizard();
  </script>
</body>
</html>
